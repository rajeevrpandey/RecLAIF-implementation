[project]
name = "reclaif-starter"
version = "0.1.0"
description = "Starter implementation of RecLAIF for incremental experimentation."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
hosted = [
  "openai>=1.0.0",
]
train = [
  "datasets>=2.20.0",
  "peft>=0.12.0",
  "torch>=2.1.0",
  "transformers>=4.45.0",
  "trl>=0.17.0",
]
full = [
  "openai>=1.0.0",
  "datasets>=2.20.0",
  "peft>=0.12.0",
  "torch>=2.1.0",
  "transformers>=4.45.0",
  "trl>=0.17.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
